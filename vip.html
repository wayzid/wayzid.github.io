<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>طريقة.زيد VIP</title>
<script type="importmap">{"imports":{"@snap/camera-kit":"https://cdn.jsdelivr.net/npm/@snap/camera-kit@1.6.5/dist/index.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
#vip-canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 18px;display:flex;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}
.badge{border:1px solid #D4AF37;color:#D4AF37;padding:6px 12px;border-radius:20px;font-size:10px}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(15,15,15,.85);backdrop-filter:blur(20px);border-radius:28px 28px 0 0;padding:18px 18px 30px;border-top:1px solid rgba(212,175,55,.25)}
.lensRow{display:flex;gap:10px;margin-bottom:16px}
.lensCard{flex:1;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;text-align:center}
.lensCard.active{border-color:#D4AF37;background:rgba(212,175,55,.15)}
.btnMain{width:100%;background:linear-gradient(90deg,#D4AF37,#F5E6A0);color:#000;border:0;padding:18px;border-radius:18px;font-weight:900;font-size:17px}
</style>
</head>
<body>
<canvas id="vip-canvas"></canvas>
<div class="top"><div>طريقة.زيد | NUSUK VIP</div><div class="badge">مكة • برج الساعة</div></div>
<div class="sheet">
<div style="text-align:center;margin-bottom:14px"><b style="font-size:20px">عدسات <span style="color:#D4AF37">طريقة.زيد</span></b><br><span style="font-size:11px;opacity:.6">a037c036-6d36-46f0-a41c-0ef2d707428d</span></div>
<div class="lensRow" id="lensRow" style="display:none">
<div class="lensCard active" id="card1">🍯<br>Honey Glow</div>
<div class="lensCard" id="card2">🍑<br>Peachy Glow</div>
</div>
<button id="startBtn" class="btnMain">تفعيل العدسة 👻</button>
<div id="status" style="font-size:11px;text-align:center;margin-top:10px;opacity:.5">ID: a037c036-6d36-46f0-a41c-0ef2d707428d • جاهز</div>
</div>
<script type="module">
import { bootstrapCameraKit } from "@snap/camera-kit";
const apiToken = "eyJhbGciOiJIUzI1NiIsImtpZCI6IkNhbnZhc1MyU0hNQUNQcm9kIiwidHlwIjoiSldUIn0.eyJhdWQiOiJjYW52YXMtY2FudmFzYXBpIiwiaXNzIjoiY2FudmFzLXMyc3Rva2VuIiwibmJmIjoxNzgyMjUwODE0LCJzdWIiOiI5OGEzNTdiOC1iYThjLTRiMGQtYmFlMC1jMmVkNWYwYWEzZWV-UFJPRFVDVElPTn41OWMyNDkyNi1jMDRjLTRkNmYtYTE4Yi04MTBjODc0MGJiMjYifQ.sXtTVLvaUNyKp0yRD6zfmCvQmGFD3DJgXRw1J63vHZE";
const lensGroupId = "a037c036-6d36-46f0-a41c-0ef2d707428d";
const canvas=document.getElementById('vip-canvas');
const btn=document.getElementById('startBtn');
const row=document.getElementById('lensRow');
const c1=document.getElementById('card1');
const c2=document.getElementById('card2');
const status=document.getElementById('status');
let session,lenses=[];
async function start(){
 try{
  btn.innerText="جاري تشغيل الكاميرا...";
  const kit=await bootstrapCameraKit({apiToken});
  session=await kit.createSession({liveRenderTarget:canvas});
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
  await session.setSource(stream);
  status.innerText="جاري تحميل العدسات...";
  const res=await kit.lensRepository.loadLensGroups([lensGroupId]);
  lenses=res.lenses;
  if(lenses.length>0){
   await session.applyLens(lenses[0]);
   status.innerText="✅ Honey Glass Glow شغالة";
   btn.style.display="none";
   row.style.display="flex";
  }else status.innerText="ما لقى عدسات";
  await session.play();
 }catch(e){status.innerText="خطأ: "+e.message; btn.innerText="حاول مرة ثانية";}
}
c1.onclick=async()=>{if(lenses[0]){await session.applyLens(lenses[0]); c1.classList.add('active'); c2.classList.remove('active');}};
c2.onclick=async()=>{if(lenses[1]){await session.applyLens(lenses[1]); c2.classList.add('active'); c1.classList.remove('active');}};
btn.addEventListener('click',start);
</script>
</body>
</html>
